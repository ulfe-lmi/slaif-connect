# Validated on 4 GiB Raspberry Pi 4 nodes. Re-run slurmd -C and lower
# RealMemory when adapting this file to different hardware.
ClusterName=vega0
SlurmctldHost=vega0-login(10.10.0.1)

SlurmUser=slurm
AuthType=auth/munge
MpiDefault=none
ReturnToService=2

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd

ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
KillWait=30
MinJobAge=300

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=vega0-login
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos,safe
JobCompType=jobcomp/none

# These ranges make srun listeners predictable. The private eth0 fabric must
# still permit dynamic PMIx peer ports in both directions.
SrunPortRange=60001-60100
MpiParams=ports=60001-60100

PriorityType=priority/multifactor
PriorityWeightAge=100
PriorityWeightFairshare=1000
PriorityWeightJobSize=100
PriorityMaxAge=7-0

SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
Prolog=/usr/local/sbin/vega-prolog
TaskProlog=/usr/local/sbin/vega-task-prolog
Epilog=/usr/local/sbin/vega-epilog

NodeName=vega0-login NodeAddr=10.10.0.1 NodeHostname=vega0-login CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=3784 State=UNKNOWN
NodeName=vega0-worker NodeAddr=10.10.0.2 NodeHostname=vega0-worker CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=3784 State=UNKNOWN

PartitionName=cpu Nodes=vega0-worker Default=YES MaxTime=2-00:00:00 DefaultTime=00:10:00 DefMemPerCPU=900 TRESBillingWeights=CPU=1.0,Mem=1G OverSubscribe=NO State=UP
PartitionName=dev Nodes=vega0-login Default=NO MaxTime=00:30:00 DefaultTime=00:10:00 DefMemPerCPU=900 TRESBillingWeights=CPU=1.0,Mem=1G OverSubscribe=NO State=UP
PartitionName=all Nodes=vega0-login,vega0-worker Default=NO MaxTime=00:30:00 DefaultTime=00:10:00 DefMemPerCPU=900 TRESBillingWeights=CPU=1.0,Mem=1G OverSubscribe=NO State=UP
